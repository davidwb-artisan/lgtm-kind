  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
          - orgId: 1
            name: Cluster-Health2
            folder: system-observability
            interval: 1m
            rules:
              - uid: ceouy3ihgc6ioc
                title: ClusterCritical2
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: lgtm-mimir
                    model:
                      disableTextWrap: false
                      editorMode: builder
                      expr: max(container_fs_reads_bytes_total{cluster="lgtm-kind"})
                      fullMetaSearch: false
                      includeNullMetadata: true
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                      useBackend: false
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: lgtm-mimir
                    model:
                      datasource:
                          type: prometheus
                          uid: lgtm-mimir
                      disableTextWrap: false
                      editorMode: builder
                      expr: max(container_cpu_usage_seconds_total{cluster="lgtm-kind"})
                      fullMetaSearch: false
                      includeNullMetadata: true
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: B
                      useBackend: false
                  - refId: E
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: lgtm-mimir
                    model:
                      datasource:
                          type: prometheus
                          uid: lgtm-mimir
                      disableTextWrap: false
                      editorMode: builder
                      expr: max(container_memory_working_set_bytes{cluster="lgtm-kind"} / 1024 ^ 2)
                      fullMetaSearch: false
                      includeNullMetadata: true
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: E
                      useBackend: false
                  - refId: F
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: lgtm-mimir
                    model:
                      datasource:
                          type: prometheus
                          uid: lgtm-mimir
                      disableTextWrap: false
                      editorMode: builder
                      expr: kube_pod_status_reason == Terminating
                      fullMetaSearch: false
                      includeNullMetadata: true
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: F
                      useBackend: false
                  - refId: C
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: __expr__
                    model:
                      conditions:
                          - evaluator:
                              params:
                                  - 0
                              type: gt
                            operator:
                              type: and
                            query:
                              params:
                                  - C
                            reducer:
                              params: []
                              type: last
                            type: query
                      datasource:
                          type: __expr__
                          uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: threshold
                  - refId: D
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: __expr__
                    model:
                      conditions:
                          - evaluator:
                              params:
                                  - 90
                                  - 0
                              type: gt
                            operator:
                              type: and
                            query:
                              params: []
                            reducer:
                              params: []
                              type: avg
                            type: query
                      datasource:
                          name: Expression
                          type: __expr__
                          uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: D
                      type: threshold
                  - refId: G
                    datasourceUid: __expr__
                    model:
                      conditions:
                          - evaluator:
                              params:
                                  - 90
                                  - 0
                              type: gt
                            operator:
                              type: and
                            query:
                              params: []
                            reducer:
                              params: []
                              type: avg
                            type: query
                      datasource:
                          name: Expression
                          type: __expr__
                          uid: __expr__
                      expression: E
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: G
                      type: threshold
                noDataState: NoData
                execErrState: Error
                for: 1m
                annotations:
                  description: ""
                  runbook_url: ""
                  summary: |-
                      {{`{{ if eq $labels.triggered_metric "1" }}`}}
                                          "Disk usage exceeded critical threshold (>90%) on affected hosts"
                                          {{`{{ else if eq $labels.triggered_metric "2" }}`}}
                                          "CPU utilization exceeded critical threshold (>90%) on affected hosts"
                                          {{`{{ else if eq $labels.triggered_metric "3" }}`}}
                                          "Memory usage exceeded critical threshold (>90%) on affected hosts"
                                          {{`{{ end }}`}}
                labels:
                  "": ""
                  health_state: firing
                  severity: critical
                  team: sre_team_1
                isPaused: false
                notification_settings:
                  receiver: Alert Hook

    contactpoints.yaml:
      secret:
        apiVersion: 1
        contactPoints: 
          - orgId: 1
            name: Alert Hook
            receivers:
              - uid: aeouwx3q12hvld
                type: webhook
                settings:
                  authorization_scheme: Bearer xxx
                  httpMethod: POST
                  message: |-
                      {
                        "status": "resolved",
                        "severity": "WARNING",
                        "details": "{\"key\": \"value\"}",
                        "reported_by": "grafana",
                        "subsystem": "hardware",
                        "externalId": "19562932-0612-4505-72b6-00769c706d71"
                      }
                  url: http://edge-compute-api-edge-compute-api-1:8081/v1/org/1/cluster/lgtm-kind/issue
                disableResolveMessage: false    
